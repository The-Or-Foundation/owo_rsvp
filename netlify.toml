# Send everything on owofest.org (and www, which already forwards here) to
# the OWO ticket page. 302 so browsers don't remember it if the site returns.
# oworsvp.netlify.app is not matched and still shows the site.
[[redirects]]
  from = "https://owofest.org/*"
  to = "https://tix.africa/discover/owo"
  status = 302
  force = true

[[redirects]]
  from = "http://owofest.org/*"
  to = "https://tix.africa/discover/owo"
  status = 302
  force = true
